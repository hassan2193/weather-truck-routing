[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "staticfiles", "frontend_dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B904", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E741"]
"config/test_settings.py" = ["F403", "F405", "E402"]
"*/migrations/*" = ["E501", "I001", "UP"]
