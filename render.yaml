# Render Blueprint: one Docker web service (API + built React app) and a managed PostgreSQL.
# Deploy: push this repo to GitHub -> Render dashboard -> New -> Blueprint -> select the repo.
services:
  - type: web
    name: haulwise
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: haulwise-db
          property: connectionString
      - key: HTTP_USER_AGENT
        value: haulwise/1.0 (set a contact email here)
      - key: WEB_CONCURRENCY
        value: "2"
      # RENDER_EXTERNAL_HOSTNAME is injected by Render and added to ALLOWED_HOSTS automatically.

databases:
  - name: haulwise-db
    plan: free
    databaseName: haulwise
    user: haulwise
